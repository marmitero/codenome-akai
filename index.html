<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#120d16" />
    <title>Codenome: AKAI</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #120d16;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        height: 100dvh;
      }
      #game canvas {
        image-rendering: pixelated;
        display: block;
      }
      /* Minimal in-game DOM input used ONLY for typing the King's nickname. */
      #akai-name-input {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        background: #241a2b;
        color: #ffe9c4;
        border: 2px solid #6d5a3a;
        border-radius: 4px;
        font-family: monospace;
        font-size: 16px;
        letter-spacing: 1px;
        text-align: center;
        padding: 8px 10px;
        outline: none;
        max-width: 70vw;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
